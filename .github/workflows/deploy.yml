name: Deploy to Mikrus

on:
  workflow_dispatch:

concurrency:
  group: ai-cookbook-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/wdenejko/ai-cookbook
  NEXT_PUBLIC_SITE_URL: https://cookbook.denejko.pl

jobs:
  deploy:
    name: Build, publish, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run types:check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Configure deployment SSH key
        env:
          DEPLOY_KEY: ${{ secrets.MIKRUS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.MIKRUS_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/mikrus_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Deploy immutable image on Mikrus
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIKRUS_HOST: ${{ vars.MIKRUS_HOST }}
          MIKRUS_PORT: ${{ vars.MIKRUS_PORT }}
        run: |
          : "${MIKRUS_HOST:?Missing MIKRUS_HOST repository variable}"
          : "${MIKRUS_PORT:?Missing MIKRUS_PORT repository variable}"
          printf '%s' "$GHCR_TOKEN" |
            ssh \
              -i "$HOME/.ssh/mikrus_deploy" \
              -p "$MIKRUS_PORT" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "root@$MIKRUS_HOST" \
              "deploy $GITHUB_SHA $GITHUB_ACTOR"

      - name: Write deployment summary
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- URL: https://cookbook.denejko.pl"
            echo "- Image: \`${IMAGE_NAME}:${GITHUB_SHA}\`"
            echo "- Authentication: disabled (public site)"
          } >> "$GITHUB_STEP_SUMMARY"
